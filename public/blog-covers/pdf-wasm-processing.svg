<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f17;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#022c22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wasmBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#pdfBg)"/>

  <!-- PDF Document Stack -->
  <g filter="url(#shadow)">
    <rect x="80" y="55" width="110" height="150" rx="6" fill="#1e293b" opacity="0.6"/>
    <rect x="95" y="45" width="110" height="150" rx="6" fill="#334155" opacity="0.8"/>
    <rect x="110" y="35" width="120" height="160" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Folded Corner -->
    <path d="M 205 35 L 230 60 L 205 60 Z" fill="#64748b"/>
    <!-- Document Lines -->
    <rect x="125" y="55" width="50" height="8" rx="2" fill="#ef4444"/>
    <rect x="125" y="75" width="85" height="5" rx="2" fill="#94a3b8"/>
    <rect x="125" y="88" width="80" height="5" rx="2" fill="#94a3b8"/>
    <rect x="125" y="101" width="70" height="5" rx="2" fill="#94a3b8"/>
    <rect x="125" y="120" width="85" height="40" rx="4" fill="#1e293b"/>
    <circle cx="150" cy="140" r="10" fill="#10b981" opacity="0.4"/>
  </g>

  <!-- WebAssembly Binary Flow -->
  <g transform="translate(250, 45)">
    <rect x="0" y="0" width="110" height="150" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="15" y="15" width="80" height="22" rx="4" fill="url(#wasmBadge)"/>
    <text x="55" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="white">WASM</text>
    
    <text x="15" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">0x25 0x50 0x44</text>
    <text x="15" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">0x46 0x2D 0x31</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">Uint8Array[]</text>
    <text x="15" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a855f7">ArrayBuffer</text>
    <text x="15" y="116" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#f59e0b">RAM ONLY (0B Net)</text>
    <rect x="15" y="126" width="80" height="12" rx="3" fill="#10b981" opacity="0.2"/>
    <text x="55" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#10b981">100% PRIVATE</text>
  </g>

  <!-- Arrows connecting -->
  <path d="M 233 115 L 247 115" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Title -->
  <text x="200" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1.5">CLIENT-SIDE PDF ENGINE</text>
  <text x="200" y="278" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" letter-spacing="2">IN-MEMORY WEBASSEMBLY PROCESSING</text>
</svg>
