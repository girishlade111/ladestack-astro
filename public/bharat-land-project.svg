<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="24" fill="#EA580C" fill-opacity="0.12"/>
  <!-- Land grid / plot map background -->
  <rect x="20" y="20" width="60" height="60" rx="12" fill="url(#landGrad)" />
  <!-- Land boundary plot lines -->
  <path d="M20 50H80M50 20V80" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Map pin / Land marker -->
  <path d="M50 30C43.3726 30 38 35.3726 38 42C38 51 50 66 50 66C50 66 62 51 62 42C62 35.3726 56.6274 30 50 30Z" fill="#FFFFFF"/>
  <circle cx="50" cy="41" r="5" fill="#EA580C"/>
  <!-- Ruler / Measurement ticks at top-left corner -->
  <path d="M26 26H38M26 31H34M26 36H38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="landGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
</svg>
