<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Lamp Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#090d16',
            foreground: '#ffffff',
            primary: '#ffffff',
          },
          backgroundImage: {
            "gradient-conic": "conic-gradient(var(--conic-position), var(--tw-gradient-stops))",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-foreground min-h-screen">

  <!-- Header mockup -->
  <header class="h-16 border-b border-white/10 flex items-center px-8 text-sm">
    <span class="font-bold text-white">LadeStack</span>
  </header>

  <!-- Hero Section -->
  <section class="relative z-0 flex min-h-[85vh] w-full flex-col items-center justify-start overflow-hidden bg-background pt-24">
    <!-- Lamp Stack -->
    <div class="absolute top-0 isolate z-0 flex w-full flex-1 items-start justify-center pointer-events-none select-none">
      <div class="absolute top-0 z-50 h-48 w-full bg-transparent opacity-10 backdrop-blur-md"></div>

      <!-- Main glow -->
      <div class="absolute inset-auto z-50 h-36 w-[28rem] translate-y-[30%] rounded-full bg-white/60 opacity-80 blur-3xl"></div>

      <!-- Lamp effect -->
      <div class="absolute top-0 z-30 h-36 -translate-y-[20%] w-[16rem] rounded-full bg-white/60 blur-2xl"></div>

      <!-- Top line -->
      <div class="absolute inset-auto z-50 h-0.5 w-[30rem] translate-y-[10%] bg-white/80 shadow-[0_0_20px_rgba(255,255,255,0.8)]"></div>

      <!-- Left gradient cone -->
      <div
        style="background-image: conic-gradient(var(--conic-position), var(--tw-gradient-stops));"
        class="absolute inset-auto right-1/2 h-56 overflow-visible w-[30rem] bg-gradient-conic from-white/60 via-transparent to-transparent [--conic-position:from_70deg_at_center_top]"
      >
        <div class="absolute w-[100%] left-0 bg-background h-40 bottom-0 z-20 [mask-image:linear-gradient(to_top,white,transparent)] [-webkit-mask-image:linear-gradient(to_top,white,transparent)]"></div>
        <div class="absolute w-40 h-[100%] left-0 bg-background bottom-0 z-20 [mask-image:linear-gradient(to_right,white,transparent)] [-webkit-mask-image:linear-gradient(to_right,white,transparent)]"></div>
      </div>

      <!-- Right gradient cone -->
      <div
        style="background-image: conic-gradient(var(--conic-position), var(--tw-gradient-stops));"
        class="absolute inset-auto left-1/2 h-56 w-[30rem] bg-gradient-conic from-transparent via-transparent to-white/60 [--conic-position:from_290deg_at_center_top]"
      >
        <div class="absolute w-40 h-[100%] right-0 bg-background bottom-0 z-20 [mask-image:linear-gradient(to_left,white,transparent)] [-webkit-mask-image:linear-gradient(to_left,white,transparent)]"></div>
        <div class="absolute w-[100%] right-0 bg-background h-40 bottom-0 z-20 [mask-image:linear-gradient(to_top,white,transparent)] [-webkit-mask-image:linear-gradient(to_top,white,transparent)]"></div>
      </div>
    </div>

    <!-- Content -->
    <div class="relative z-50 flex flex-col items-center text-center px-4 max-w-4xl mx-auto">
      <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white leading-tight">
        Build, Edit, and Optimize <span class="text-blue-400">Directly in Your Browser.</span>
      </h1>
      <p class="mt-6 text-lg sm:text-xl text-neutral-400 max-w-2xl leading-relaxed">
        High-performance developer utilities with client-side execution. Zero server uploads, zero subscription walls, and instant performance across all tools.
      </p>
      <div class="mt-8 flex gap-4">
        <button class="px-6 py-3 rounded-lg bg-white text-black font-semibold hover:bg-neutral-200 transition">Explore 17+ Tools</button>
        <button class="px-6 py-3 rounded-lg border border-white/20 text-white font-semibold hover:bg-white/10 transition">Launch Studio IDE</button>
      </div>
    </div>
  </section>

</body>
</html>
